name: DeepGene CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepgene-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-and-frontend:
    name: Python, API contracts, and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install runtime and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile app/server.py

      - name: Run V2 unit and contract tests
        run: python -m unittest discover -s tests -p 'test_v2_*.py' -v

      - name: Refresh official HPO annotation audit
        run: |
          curl --fail --location --retry 3 https://purl.obolibrary.org/obo/hp.obo --output data/raw/hp.obo
          python data/ml/60_enrich_v2_hpo_official.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate frontend JavaScript
        run: node --check app/static/app.js

  api-smoke:
    name: Local API smoke test
    runs-on: ubuntu-latest
    needs: python-and-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Start local DeepGene server
        run: |
          python app/server.py > deepgene-server.log 2>&1 &
          echo $! > deepgene-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat deepgene-server.log
          exit 1

      - name: Verify JSON API contracts
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          endpoints = [
              "/api/health",
              "/api/summary",
              "/api/v2/summary",
              "/api/v2/prioritization?limit=6",
          ]
          for endpoint in endpoints:
              with urlopen("http://127.0.0.1:8765" + endpoint, timeout=10) as response:
                  assert response.headers.get_content_type() == "application/json", endpoint
                  payload = json.load(response)
                  assert isinstance(payload, dict), endpoint
          print("API smoke tests passed")
          PY

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deepgene-server-log
          path: deepgene-server.log

      - name: Stop local server
        if: always()
        run: if [ -f deepgene-server.pid ]; then kill "$(cat deepgene-server.pid)" || true; fi
